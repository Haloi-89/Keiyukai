<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Liên hệ</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1>📞 LIÊN HỆ</h1>
    </header>

    <nav>
      <a href="gioithieu.html">Giới thiệu</a>
      <a href="index.html">Trang chủ</a>
      <a href="tailieu.html">Tài liệu</a>
      <a href="dangnhap.html">Đăng nhập</a>
      <a href="lienhe.html">Liên hệ</a>
    </nav>

    <main>
      <section class="content">
        <h2>📩 Gửi tin nhắn cho chúng tôi</h2>

        <form>
          <label for="name"> Họ và tên: </label>

          <input type="text" id="name" placeholder="Nhập họ tên" /><br />

          <label for="email"> Email: </label>

          <input type="email" id="email" placeholder="Nhập email" /><br />

          <label for="message"> Nội dung: </label>

          <textarea
            id="message"
            rows="10"
            placeholder="Nhập nội dung cần liên hệ"
          >
          </textarea>

          <button type="submit">Gửi liên hệ</button>
        </form>
      </section>
    </main>

    <footer>
      <p id="footer">© Học tiếng nhật cùng Keiyukai</p>
    </footer>
  </body>
</html>
